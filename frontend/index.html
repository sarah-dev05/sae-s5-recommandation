<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil — MUST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Rempli par js/navbar.js -->
  <header id="navbar"></header>

  <main>
    <!-- Messages de chargement / erreur -->
    <p id="status" class="status" role="status"></p>

    <!-- Film mis en avant : rempli par accueil.js -->
    <section id="hero" class="hero" aria-label="Film mis en avant"></section>

    <section class="cta" aria-labelledby="titre-cta">
      <h2 id="titre-cta">Trouve ton prochain film</h2>
      <p class="muted">Choisis 3 à 5 films que tu aimes : on te propose des films proches de ta sélection.</p>
      <a class="btn" href="selection.html">Lancer une recommandation</a>
    </section>

    <section aria-labelledby="titre-rail">
      <h2 id="titre-rail">Films du moment</h2>
      <ul id="rail" class="rail"></ul>
    </section>
  </main>

  <script type="module" src="js/accueil.js"></script>
</body>
</html>
